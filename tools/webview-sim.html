<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Simula la struttura di una webview di VS Code: pagina esterna con CSP
     restrittiva e iframe sandboxato verso il proxy di Antigravity. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src http://127.0.0.1:* http://localhost:*; style-src 'unsafe-inline';">
<style>html,body{height:100%;margin:0}iframe{width:100%;height:100%;border:none}</style>
</head>
<body>
<iframe sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-downloads"
        allow="clipboard-read; clipboard-write; microphone"
        src="http://127.0.0.1:59474/"></iframe>
</body>
</html>
